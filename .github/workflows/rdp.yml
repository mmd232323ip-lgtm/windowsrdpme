name: Windows RDP Cloudflare

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

      - name: Set Password
        run: |
          net user runneradmin P@ssw0rd123

      - name: Install cloudflared
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

      - name: Start Tunnel
        run: |
          Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel","--url","tcp://localhost:3389" -NoNewWindow
          Start-Sleep -Seconds 25

      - name: Show Info
        run: |
          Write-Host "========================================"
          Write-Host "Username : runneradmin"
          Write-Host "Password : P@ssw0rd123"
          Write-Host "========================================"
          Write-Host "الان تو لاگ‌های cloudflared دنبال آدرس trycloudflare.com بگرد"
          Write-Host "آدرس چیزی شبیه این میاد: xxxxx.trycloudflare.com"

      - name: Keep Alive
        run: |
          while ($true) { Start-Sleep -Seconds 300 }
